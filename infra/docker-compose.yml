services:
  api-gateway:
    build:
      context: ../services/api-gateway
    container_name: api-gateway
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: development
      AUTH_SERVICE_URL: http://auth-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      CHAT_SERVICE_URL: http://chat-service:3005
      JWT_SECRET: change_me_in_dev
    depends_on:
      - auth-service
      - product-service
      - chat-service

  auth-service:
    build:
      context: ../services/auth-service
    container_name: auth-service
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      NODE_ENV: development
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/auth_service
      JWT_SECRET: change_me_in_dev
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
    depends_on:
      - postgres

  product-service:
    build:
      context: ../services/product-service
    container_name: product-service
    ports:
      - '3002:3002'
    environment:
      PORT: 3002
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/product_service
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
    depends_on:
      - mongodb

  chat-service:
    build:
      context: ../services/chat-service
    container_name: chat-service
    ports:
      - '3005:3005'
    environment:
      PORT: 3005
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/chat_service
      JWT_SECRET: change_me_in_dev
    depends_on:
      - mongodb

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_service
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  mongo_data:
  redis_data: